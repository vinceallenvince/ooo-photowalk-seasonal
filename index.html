<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Christmas Pigeons</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; }
  img { display: block; width: 100%; height: auto; }
  #status { color: #999; font: 14px -apple-system, system-ui, sans-serif;
            padding: 16px; margin: 0; }
</style>
</head>
<body>
<p id="status">Loading…</p>
<main id="feed"></main>
<script>
  const API = "https://api.github.com/repos/vinceallenvince/walk-and-hack/contents/transformed";
  const feed = document.getElementById("feed");
  const status = document.getElementById("status");

  fetch(API)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(files => {
      const imgs = files
        .filter(f => /\.(png|jpe?g|webp)$/i.test(f.name))
        .sort((a, b) => b.name.localeCompare(a.name)); // newest first
      if (!imgs.length) { status.textContent = "No pigeons yet."; return; }
      status.remove();
      for (const f of imgs) {
        const img = document.createElement("img");
        img.src = f.download_url;
        img.alt = f.name;
        img.loading = "lazy";
        feed.appendChild(img);
      }
    })
    .catch(e => { status.textContent = "Couldn't load images (" + e.message + "). Try again in a minute."; });
</script>
</body>
</html>
