name: Transform pigeons

on:
  push:
    branches: [main]
    paths: ["pigeons/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: transform-pigeons
  cancel-in-progress: false

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install openai requests pillow

      - name: Transform new pigeons
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          IMAGE_MODEL: gpt-image-2.5-sunburst
        run: python scripts/transform.py

      - name: Commit results and notify
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
        run: |
          git config user.name "pigeon-bot"
          git config user.email "pigeon-bot@users.noreply.github.com"
          git add transformed classifications
          if git diff --cached --quiet; then
            echo "Nothing new to commit"
            exit 0
          fi
          git commit -m "Christmas pigeons"
          git pull --rebase
          git push

          latest=$(git diff --name-only HEAD~1 HEAD -- transformed | sort | tail -1)
          if [ -n "$BARK_KEY" ] && [ -n "$latest" ]; then
            stem=$(basename "$latest" .png)
            slogan=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1])).get('direction',{}).get('slogan',''))" "classifications/$stem.json" 2>/dev/null || true)
            body="Tap to see it"
            [ -n "$slogan" ] && body="“$slogan” · Tap to see it"
            curl -s -X POST "https://api.day.app/$BARK_KEY" \
              --data-urlencode "title=New Christmas pigeon 🎄" \
              --data-urlencode "body=$body" \
              --data-urlencode "url=https://raw.githubusercontent.com/vinceallenvince/walk-and-hack/main/$latest" \
              --data-urlencode "group=pigeons" \
              --data-urlencode "level=timeSensitive" > /dev/null
          fi
